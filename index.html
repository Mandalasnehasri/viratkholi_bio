<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Virat Kohli Blog</title>
  <style>
    body {
      font-family: sans-serif;
      background: url("https://media.istockphoto.com/id/517188688/photo/mountain-landscape.jpg?s=1024x1024&w=0&k=20&c=z8_rWaI8x4zApNEEG9DnWlGXyDIXe-OmsAyQ5fGPVV8=") ;
      background-size: 100%;
      margin: 0;
      padding: 0;
      background-color:transparent;
    }

    h1 {
      text-align: center;
      color: white;
      margin-top: 10px;
      text-shadow: 2px 2px 4px rgba(255,255,255,0.1);
    }

    form {
      background-color: rgba(255,255,255,0.1);
      max-width: 400px;
      margin: 10px auto;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 20px  rgba(255,255,255,0.1);
    }

    label {
      display: block;
      margin-bottom: 15px;
      
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px ;
      border-radius: 5px;
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    button {
      background-color: #1e90ff;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #0d74d1;
    }
  </style>
  <script>
    function handleSubmit(event) {
      event.preventDefault(); // prevent default form submission

      alert("Registration successful!");
      window.location.href = "login.html"; // redirect to login page
    }
  </script>
</head>
<body>
  <h1>Register</h1>
  <form onsubmit="handleSubmit(event)">
    <label>:
      <input type="text" 
      name="name" 
      placeholder="Enter the name"/>
    </label>
    <label>:
      <input type="email"
       name="email"
       placeholder="Enter the email"/>
    </label>
    <label>:
      <input type="password"
       name="password" 
       placeholder="Enter the password"/>
    </label>
    <label>
      <input type="password"
       name="confirmpassword" 
       placeholder="Confirmpassword"/>
    </label>
    <label>
      <input type="tel" 
      name="mobile" 
      placeholder=" mobile number"/>
    </label>
    <label>
      <input type="date" 
      name="dob" 
      placeholder="Date of Birth"/>
    </label>
    <label>
      <textarea name="address" 
      placeholder="Address"></textarea>
    </label>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
